spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  multipart:
    enabled: true
    max-file-size: 1MB
    max-request-size: 1MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${COHOUSE_MAIL_USERNAME}
    password: ${COHOUSE_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  issuer: cohouse

cloud:
  aws:
    region:
      static: ap-northeast-2

app:
  frontend:
    url: ${FRONTEND_URL}