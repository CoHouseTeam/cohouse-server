spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  multipart:
    enabled: true
    max-file-size: 1MB
    max-request-size: 1MB

jwt:
  secret: ${JWT_SECRET}
  issuer: cohouse

cloud:
  aws:
    region:
      static: ap-northeast-2

firebase:
  project-id: cohouse-6ba91