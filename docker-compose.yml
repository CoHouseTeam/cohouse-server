version: '3.8'
services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1
      MYSQL_DATABASE: cohouse_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cohouse-network

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - cohouse-network

  app:
    image: blubincod/cohouse-server:latest
    container_name: app
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    networks:
      - cohouse-network

networks:
  cohouse-network:
    driver: bridge

volumes:
  mysql_data: