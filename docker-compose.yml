version: '3.8'
services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1
      MYSQL_DATABASE: cohouse_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./my_custom.cnf:/etc/my.cnf
    networks:
      - cohouse-network

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cohouse-network

  app:
    image: blubincod/cohouse-server:latest
    container_name: app
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    volumes:
      - /lib/x86_64-linux-gnu/libtesseract.so:/lib/x86_64-linux-gnu/libtesseract.so:ro
      - /lib/x86_64-linux-gnu/libtesseract.so.5:/lib/x86_64-linux-gnu/libtesseract.so.5:ro
      - /usr/share/tesseract-ocr/5/tessdata:/usr/share/tesseract-ocr/5/tessdata:ro
    environment:
      - LD_LIBRARY_PATH=/lib/x86_64-linux-gnu
      - TESSDATA_PREFIX=/usr/share/tesseract-ocr/5/tessdata
    networks:
      - cohouse-network

networks:
  cohouse-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data: